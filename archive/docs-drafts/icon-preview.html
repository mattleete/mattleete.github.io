<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Icon Preview</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; max-width: 700px; }
    .pair { background: white; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .label { font-size: 11px; color: #888; text-align: center; }
    .icons { display: flex; gap: 16px; align-items: center; }
    svg { width: 24px; height: 24px; }
    .dark-bg { background: #111; border-radius: 8px; padding: 8px; }
  </style>
</head>
<body>
<h2 style="margin-bottom:24px;font-size:16px;color:#333">Sun &amp; Moon icon options — pick your favourite</h2>
<div class="grid">

  <!-- 1: Feather (current) -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </div>
    </div>
    <div class="label">1 — Feather<br>(current)</div>
  </div>

  <!-- 2: Filled solid -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="#111">
        <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="white">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </div>
    </div>
    <div class="label">2 — Filled solid</div>
  </div>

  <!-- 3: Minimal thin -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1" stroke-linecap="round">
        <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </div>
    </div>
    <div class="label">3 — Minimal thin</div>
  </div>

  <!-- 4: Bold chunky -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </div>
    </div>
    <div class="label">4 — Bold</div>
  </div>

  <!-- 5: Stars on moon -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
        <path d="M17 12a5 5 0 1 1-5-5 3.5 3.5 0 0 0 5 5z"/>
        <path d="M19 4l.5 1L21 5.5l-1.5.5L19 7l-.5-1.5L17 5l1.5-.5z" fill="#111" stroke="none"/>
        <circle cx="19.5" cy="10" r="0.75" fill="#111"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="white">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>
    <div class="label">5 — Stars & moon</div>
  </div>

  <!-- 6: Rounded dots sun -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
        </svg>
      </div>
    </div>
    <div class="label">6 — Long rays</div>
  </div>

  <!-- 7: Half-filled moon -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" stroke="#111" stroke-width="1.5" stroke-linecap="round">
        <path d="M12 3a9 9 0 0 0 0 18 9 9 0 0 1 0-18z" fill="#111"/>
        <path d="M12 3a9 9 0 0 1 0 18" fill="none"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </div>
    </div>
    <div class="label">7 — Half moon</div>
  </div>

  <!-- 8: Circle + arc moon -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
        <path d="M12 3a9 9 0 0 0 9 9 9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="5" fill="white" fill-opacity="0.15"/>
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </div>
    </div>
    <div class="label">8 — Arc moon</div>
  </div>

  <!-- 9: Phosphor style -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="#111">
        <path d="M12.048 3.003A9 9 0 1 0 20.997 11.952 1 1 0 0 0 20 11a8 8 0 0 1-8-8 1 1 0 0 0-.952-1z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414L5.636 16.95zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/>
        </svg>
      </div>
    </div>
    <div class="label">9 — Phosphor style</div>
  </div>

  <!-- 10: Ultra minimal -->
  <div class="pair">
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
        <path d="M19 12.5A7.5 7.5 0 1 1 11.5 5a5.5 5.5 0 0 0 7.5 7.5z"/>
      </svg>
      <div class="dark-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.5"/>
          <path d="M12 5V3M12 21v-2M5 12H3M21 12h-2M7.05 7.05 5.64 5.64M18.36 18.36l-1.41-1.41M7.05 16.95l-1.41 1.41M18.36 5.64l-1.41 1.41"/>
        </svg>
      </div>
    </div>
    <div class="label">10 — Ultra minimal</div>
  </div>

</div>
</body>
</html>
