# Standard About section (replaces the three About cards). Edited via
# /admin/ → Settings → Home page → About. Every claim is verified in Matt's
# facts database; client names stay anonymised.
about:
  eyebrow: "About"
  headline: "I'm a senior product designer in Sydney, and I work from the first research session through to the shipped product."
  body: |
    For the last four and a half years I was a member of KPMG Creates, the creative agency team inside KPMG Customer, designing products and customer experiences for some of the largest organisations in Australia: a superannuation fund with around $100 billion under management, two state governments, a university, an Indigenous not-for-profit, and an internally funded AI product that I designed and project managed from the first research workshops through to a full build.

    Before consulting I founded Spix, an accessibility product for videogamers with impaired speech, which won the Remarkable accessible design contest and a place in a product accelerator, and I researched multimodal interaction at the University of Sydney Design Lab, where I also tutored the product design graduation studio. I hold a Master of Interaction Design from the University of Sydney and a Bachelor of Product Design from UTS.

    In my opinion the job is to weigh the business drivers, the domain and the customer equally, and to be comfortable in the grey areas where there is more than one right answer. I like the blend of technical and human in this work, and the balance of experimentation and repetition; lately that includes designing straight to code with AI-assisted tooling, which is how this site was built. I finished at KPMG in September 2026 and I'm looking for my next senior product design role.
  actions:
    - { label: "More about me", href: "portfolio-about.html", secondary: false }
    - { label: "View CV", href: "cv.html", secondary: true }
