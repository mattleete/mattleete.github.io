  joiner: "into"
  # Cycles through these pairs: "Turn {first} into {second}"
  pairs:
    - { first: "apathy", second: "joy" }
    - { first: "chaos", second: "clarity" }
    - { first: "friction", second: "flow" }
  name: "Matt Leete"
  role: "Product Designer"

sections:
  - id: work
    title: "Work"
    cards:
      - title: "Making complex simple"
        desc: "A member-experience strategy and product concepts that make a complex superannuation journey feel simple."
        tags: ["Product Design", "CX", "Journey Mapping"]
        href: portfolio-case-study-rest-super.html
      - title: "Making unknown trustworthy"
        desc: "Building trust into an AI-powered workflow accelerator — so people rely on what they can't fully see."
        tags: ["Product Design", "UX", "AI"]
        href: portfolio-case-study-ai-accelerator.html
      - title: "Making formidable fun"
        desc: "A product concept bringing more inclusive, playful voice communication to competitive gaming."
