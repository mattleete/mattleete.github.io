        status_label: "In progress"

  - id: fun
    title: "Fun"
    cards:
      - title: "Occypicks"
        desc: "A fantasy game for the 2026 World Cup — friends snake-draft all 48 teams, then climb a live leaderboard as the tournament plays out. Designed, built, and shipped solo."
