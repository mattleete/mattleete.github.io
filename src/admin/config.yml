# Decap CMS configuration — https://decapcms.org/docs/configuration-options/
# Login runs through the helper in tools/decap-oauth (deployed on Vercel).

backend:
  name: github
  repo: mattleete/mattleete.github.io
  branch: main
  base_url: https://mattleete-github-io.vercel.app
  auth_endpoint: auth
  commit_messages:
    create: "CMS: add {{collection}} “{{slug}}”"
    update: "CMS: update {{collection}} “{{slug}}”"
    delete: "CMS: delete {{collection}} “{{slug}}”"
    uploadMedia: "CMS: add image {{path}}"
    deleteMedia: "CMS: remove image {{path}}"

# Drafts become pull requests; only “Publish” lands on main and goes live.
publish_mode: editorial_workflow

media_folder: src/images
public_folder: /images

site_url: https://mattleete.github.io
display_url: https://mattleete.github.io
logo_url: https://mattleete.github.io/apple-touch-icon.png

collections:
  - name: case_studies
    label: Case studies
    label_singular: Case study
    folder: src/case-studies
    create: true
    slug: "{{slug}}"
    preview_path: "portfolio-case-study-{{slug}}.html"
    summary: "{{title}} — {{industry}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, hint: "The big headline. Lead with the outcome or the tension." }
      - { label: Subtitle, name: subtitle, widget: text, hint: "One or two sentences under the title." }
      - { label: Meta description, name: description, widget: text, hint: "What search engines and link previews show. ~150 characters." }
      - { label: Breadcrumb, name: breadcrumb, widget: string, default: "Work" , hint: "e.g. “Work → Higher Education” or “Fun → Occypicks”" }
      - { label: Tags, name: tags, widget: list, hint: "First tag is highlighted." }
      - label: Details
        name: meta
        widget: list
        hint: "The label/value pairs beside the title — My role, Industry, Timeline, Team, Deliverables… Use a line break for multiple values."
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: text }
      - label: Overview strip
        name: overview
        widget: object
        hint: "The three cells under the hero image."
        fields:
          - { label: The challenge, name: challenge, widget: text }
          - { label: The approach, name: approach, widget: text }
          - { label: The outcome, name: outcome, widget: text }
      - { label: Hero image, name: hero_image, widget: image, required: false }
      - { label: Hero image caption, name: hero_caption, widget: string, required: false }
      - { label: Password-protected, name: gated, widget: boolean, default: true, hint: "Off = anyone can read it." }
      - { label: Draft (hidden from the site), name: draft, widget: boolean, default: false }
      - { label: Next project, name: next, widget: relation, collection: case_studies, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
      - { label: Body, name: body, widget: markdown, hint: "Each “## Heading” becomes a numbered section. Bold a sentence to make it a pull-quote." }

  - name: pages
    label: Pages
    editor:
      preview: false
    files:
      - name: about
        label: About
        file: src/about.md
        fields:
          - { label: Meta description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: text }
              - { label: Intro, name: intro, widget: text }
              - label: Buttons
                name: actions
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Secondary style, name: secondary, widget: boolean, default: false }
          - { label: Bio, name: body, widget: markdown, hint: "The paragraphs beside the photo. **Bold** is allowed." }
          - label: What I do
            name: skills
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Note, name: note, widget: text }
              - label: Skill groups
                name: cells
                widget: list
                fields:
                  - { label: Category, name: category, widget: string }
                  - { label: Skills, name: items, widget: list }
          - label: Details row
            name: meta
            widget: list
            hint: "Tools · Qualifications · Based in. Use a line break for multiple values."
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: text }
          - label: Selected work
            name: work
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Note, name: note, widget: text }
              - label: Groups
                name: groups
                widget: list
                fields:
                  - { label: Group label, name: label, widget: string }
                  - label: Items
                    name: items
                    widget: list
                    fields:
                      - { label: Role, name: role, widget: string }
                      - { label: Organisation · year, name: org_year, widget: string }
                      - { label: Project, name: context, widget: string }
                      - { label: Description, name: desc, widget: text }
          - label: Closing call-to-action
            name: cta
            widget: object
            fields:
              - { label: Text, name: text, widget: string }
              - label: Buttons
                name: actions
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Secondary style, name: secondary, widget: boolean, default: false }
          - { label: Layout (do not change), name: layout, widget: hidden, default: layouts/about.njk }
          - { label: URL (do not change), name: permalink, widget: hidden, default: portfolio-about.html }
          - { label: Title, name: title, widget: hidden, default: About }

      - name: cv
        label: CV
        file: src/cv.md
        fields:
          - { label: Meta description, name: description, widget: text }
          - { label: Name, name: name, widget: string }
          - { label: Role, name: role, widget: string }
          - { label: PDF file, name: pdf, widget: string, hint: "Path of the downloadable CV, e.g. matt-leete-cv.pdf" }
          - { label: PDF button label, name: pdf_label, widget: string }
          - label: Sections
            name: sections
            widget: list
            fields:
              - { label: Section label, name: label, widget: string, hint: "e.g. Experience, Education" }
              - label: Rows
                name: rows
                widget: list
                fields:
                  - { label: Organisation, name: org, widget: string }
                  - { label: Position, name: position, widget: string }
                  - { label: Dates, name: dates, widget: string }
          - { label: Layout (do not change), name: layout, widget: hidden, default: layouts/cv.njk }
          - { label: URL (do not change), name: permalink, widget: hidden, default: cv.html }
          - { label: Title, name: title, widget: hidden, default: CV }

      - name: contact
        label: Contact
        file: src/contact.md
        fields:
          - { label: Meta description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Intro, name: intro, widget: text }
          - { label: Email address, name: email, widget: string }
          - label: Channels
            name: channels
            widget: list
            fields:
              - { label: Platform, name: platform, widget: string }
              - { label: Link text, name: label, widget: string }
              - { label: Arrow, name: arrow, widget: string, default: "→" }
              - { label: Sub-line, name: sub, widget: string }
              - { label: Link, name: href, widget: string }
              - { label: Opens in new tab, name: external, widget: boolean, default: false }
          - { label: Availability line, name: availability, widget: string }
          - { label: Layout (do not change), name: layout, widget: hidden, default: layouts/contact.njk }
          - { label: URL (do not change), name: permalink, widget: hidden, default: portfolio-contact.html }
          - { label: Title, name: title, widget: hidden, default: Contact }

  - name: settings
    label: Settings
    editor:
      preview: false
    files:
      - name: home
        label: Home page
        file: src/_data/home.yml
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: First word, name: prefix, widget: string, default: "Turn" }
              - { label: Middle word, name: joiner, widget: string, default: "into" }
              - label: Word pairs
                name: pairs
                widget: list
                hint: "The hero cycles through these — “Turn {first} into {second}”."
                fields:
                  - { label: First, name: first, widget: string }
                  - { label: Second, name: second, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
          - label: Sections
            name: sections
            widget: list
            fields:
              - { label: Section label, name: label, widget: string, hint: "e.g. Experience, Education" }
              - label: Rows
                name: rows
                widget: list
                fields:
                  - { label: Organisation, name: org, widget: string }
                  - { label: Position, name: position, widget: string }
                  - { label: Dates, name: dates, widget: string }
          - { label: Layout (do not change), name: layout, widget: hidden, default: layouts/cv.njk }
          - { label: URL (do not change), name: permalink, widget: hidden, default: cv.html }
          - { label: Title, name: title, widget: hidden, default: CV }

      - name: contact
        label: Contact
        file: src/contact.md
        fields:
          - { label: Meta description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Intro, name: intro, widget: text }
          - { label: Email address, name: email, widget: string }
          - label: Channels
            name: channels
            widget: list
            fields:
              - { label: Platform, name: platform, widget: string }
              - { label: Link text, name: label, widget: string }
              - { label: Arrow, name: arrow, widget: string, default: "→" }
              - { label: Sub-line, name: sub, widget: string }
              - { label: Link, name: href, widget: string }
              - { label: Opens in new tab, name: external, widget: boolean, default: false }
          - { label: Availability line, name: availability, widget: string }
          - { label: Layout (do not change), name: layout, widget: hidden, default: layouts/contact.njk }
          - { label: URL (do not change), name: permalink, widget: hidden, default: portfolio-contact.html }
          - { label: Title, name: title, widget: hidden, default: Contact }

  - name: settings
    label: Settings
    editor:
      preview: false
    files:
      - name: home
        label: Home page
        file: src/_data/home.yml
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: First word, name: prefix, widget: string, default: "Turn" }
              - { label: Middle word, name: joiner, widget: string, default: "into" }
              - label: Word pairs
                name: pairs
                widget: list
                hint: "The hero cycles through these — “Turn {first} into {second}”."
                fields:
                  - { label: First, name: first, widget: string }
                  - { label: Second, name: second, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
          - label: About
            name: about
            widget: object
            hint: "The prose About section under the card rows."
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: "About" }
              - { label: Headline, name: headline, widget: text }
              - { label: Body, name: body, widget: markdown, hint: "Two or three paragraphs. Keep client names anonymised." }
              - label: Buttons
                name: actions
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Secondary style, name: secondary, widget: boolean, default: false }
          - label: Sections
            name: sections
            widget: list
            hint: "Work · Fun. Each holds a row of cards."
            fields:
              - { label: Anchor id, name: id, widget: string, hint: "Used in links, e.g. index.html#work" }
              - { label: Title, name: title, widget: string }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: desc, widget: text }
                  - { label: Tags, name: tags, widget: list }
                  - { label: Link, name: href, widget: string, required: false, hint: "e.g. portfolio-case-study-occypicks.html. Leave empty for no link." }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: Status, name: status, widget: select, options: [{ label: "Published", value: "" }, { label: "In progress (badge, not clickable)", value: "in-progress" }], required: false }
                  - { label: Status label, name: status_label, widget: string, required: false, default: "In progress" }

      - name: site
        label: Site details
        file: src/_data/site.yml
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title / role, name: title, widget: string }
          - { label: Site URL, name: url, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string }
          - { label: Case-study password, name: case_study_password, widget: string, hint: "Visible in the page source — a courtesy gate, not security." }
          - { label: Share image, name: og_image, widget: string, hint: "Path used for link previews, e.g. /images/og-image.jpg" }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
